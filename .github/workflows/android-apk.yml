# Android APK — build the installable APK and smoke-test it on device lanes.
#
# Scope honesty:
#   * GitHub-hosted runners have no physical phones. The "device" lanes are
#     Android emulators (x86_64, KVM-accelerated) using Google's official
#     Pixel 9 and Pixel 9 Pro XL AVD hardware profiles on Android 15
#     (API 35). Testing on real hardware requires a device farm (e.g.
#     Firebase Test Lab), which needs a paid account + service-account
#     secrets and is intentionally not wired here.
#   * There is no iOS lane: an APK is an Android package and cannot run on
#     an iPhone, and this repository has no iOS frontend.
name: Android APK

on:
  push:
    branches: ["**"]
    # Emulator lanes are expensive (~10-15 min each); only run when something
    # that can change the APK changes. `pull_request` is intentionally not a
    # trigger — all PRs come from same-repo branches (see ci.yml).
    paths:
      - "android/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      # The two-peer device lane runs against this relay, so its config is part
      # of what can break the lane.
      - "deploy/test-relay/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── Job 1: Cross-compile Rust → Android .so ─────────────────────────────────
  # arm64-v8a is what real handsets run (Pixel 9, Moto Edge 60 Pro are both
  # arm64), so the uploaded APK can be sideloaded onto them. x86_64 is what
  # the emulator lanes below run.
  build-jni:
    name: Build JNI lib (${{ matrix.abi }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - target: aarch64-linux-android
            abi: arm64-v8a
          - target: x86_64-linux-android
            abi: x86_64

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust stable + Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-${{ matrix.target }}-

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
          # local-cache:true can report an ndk-path whose toolchain lives one
          # directory deeper (the r27c archive nests), which breaks cargo-ndk's
          # linker lookup. Disable it and resolve the real path below.
          local-cache: false

      - name: Resolve NDK toolchain path
        # cargo-ndk spawns $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/<host>/bin/clang.
        # Confirm clang is actually there; if setup-ndk nested it, locate it and
        # re-point ANDROID_NDK_HOME/ROOT. Fail fast with a clear message otherwise.
        run: |
          set -euo pipefail
          host="linux-x86_64"
          ndk="${{ steps.ndk.outputs.ndk-path }}"
          echo "setup-ndk reported ndk-path: '$ndk'"
          clang="$ndk/toolchains/llvm/prebuilt/$host/bin/clang"
          if [ ! -x "$clang" ]; then
            echo "clang not at '$clang'; searching under '$ndk' …"
            found="$(find "$ndk" -type f -name clang -path "*/prebuilt/$host/bin/clang" 2>/dev/null | head -n1 || true)"
            if [ -z "$found" ]; then
              echo "::error::NDK clang not found under '$ndk' — setup-ndk layout unexpected."
              exit 1
            fi
            ndk="${found%/toolchains/*}"
            echo "resolved real NDK home: '$ndk'"
          fi
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ndk" >> "$GITHUB_ENV"
          echo "Using NDK at: $ndk"

      - name: Build comrade_jni for ${{ matrix.abi }}
        # media-http enables the attachment pipeline so the sideloadable APK can
        # send/receive media (matches the release build). catalogue-http enables
        # the recording lookup behind Together's search field — without it the
        # shipped app has a search box that can only answer
        # `UiError::CatalogueUnavailable`, which is the honest failure but not a
        # feature.
        # travel-http is the same argument once more, for the Travel tab: it is
        # what lets the tab reach OpenStreetMap, Wikipedia and Google Places at
        # all, and without it the tab can only answer
        # `UiError::TravelUnavailable`.
        run: |
          cargo ndk \
            --target ${{ matrix.target }} \
            --output-dir android/app/src/main/jniLibs \
            -- build --release -p comrade_jni --features media-http,catalogue-http,travel-http

      - name: Upload JNI .so artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-jniLibs-${{ matrix.abi }}
          # Upload the jniLibs ROOT so the artifact keeps the <abi>/ folder —
          # AGP needs jniLibs/<abi>/libcomrade_jni.so (see release.yml).
          path: android/app/src/main/jniLibs/
          if-no-files-found: error

  # ── Job 2: Assemble the debug APK and publish it as a run artifact ──────────
  # Debug-signed, so anyone can download it from the run and sideload it onto
  # a real Pixel 9 / Moto Edge 60 Pro for manual testing.
  build-apk:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build-jni

    steps:
      - uses: actions/checkout@v5
        with:
          # Full history, not the default shallow (depth-1) clone: the
          # version-code step below counts commits with `git rev-list
          # --count HEAD`, which needs the whole history to be accurate.
          fetch-depth: 0

      - name: Download JNI libs
        uses: actions/download-artifact@v4
        with:
          pattern: apk-jniLibs-*
          merge-multiple: true
          path: android/app/src/main/jniLibs/

      - name: Verify JNI lib layout
        run: |
          ls -R android/app/src/main/jniLibs
          for abi in arm64-v8a x86_64; do
            test -f "android/app/src/main/jniLibs/$abi/libcomrade_jni.so" \
              || { echo "::error::missing jniLibs/$abi/libcomrade_jni.so"; exit 1; }
          done

      - name: Install Rust stable
        # Gradle's Kotlin compile tasks now depend on `generateUniffiBindings`
        # (android/app/build.gradle.kts), which builds comrade_jni for the
        # host and runs `comrade_uniffi_bindgen` — needed even here, on the
        # job that only *assembles* the APK from the already cross-compiled
        # .so files above.
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo (host, uniffi bindgen)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-host-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-host-

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          # Google removed the legacy `tools` SDK package; the action's default
          # `packages` ("tools platform-tools") therefore fails at sdkmanager.
          # Keep platform-tools, drop tools. The next step installs the rest.
          packages: 'platform-tools'

      - name: Install build-tools & platform
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Compute version
        # versionCode must be monotonically increasing across BOTH this
        # workflow and release.yml — otherwise a sideloaded debug build and
        # a tagged release can compare as a "downgrade" against each other
        # and Android refuses the install. Commit count on HEAD is history
        # shared by both workflows and only ever grows, unlike each
        # workflow's own `github.run_number`, which is workflow-local and
        # not comparable to the other file's counter (see release.yml).
        run: |
          set -euo pipefail
          echo "VERSION_CODE=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"
          echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Assemble debug APK
        working-directory: android
        env:
          # Baked-in default TURN relay (see app/build.gradle.kts). Accepts
          # either Actions *secrets* or repository/environment *variables*
          # (secrets win when both are set — vars are readable by anyone with
          # repo read access, so prefer secrets for the credential pair).
          # Empty if neither is set → no default relay compiled in.
          TURN_URL: ${{ secrets.TURN_URL || vars.TURN_URL }}
          TURN_USERNAME: ${{ secrets.TURN_USERNAME || vars.TURN_USERNAME }}
          TURN_PASSWORD: ${{ secrets.TURN_PASSWORD || vars.TURN_PASSWORD }}
        run: |
          ./gradlew assembleDebug \
            -PversionCode="$VERSION_CODE" \
            -PversionName="0.1.0-$SHORT_SHA" \
            --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: comrade-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  # ── Job 3: Install + run the on-device smoke suite on emulator lanes ────────
  # Runs `connectedDebugAndroidTest` (android/app/src/androidTest), which
  # builds the APK + test APK, installs both on the emulator, and executes
  # DeviceSmokeTest on the device: JNI .so loads, Rust crypto round-trips,
  # MainActivity reaches RESUMED.
  device-test:
    name: Device test — ${{ matrix.device }} (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: build-jni
    strategy:
      # One lane failing should not cancel the other — per-device signal is
      # the whole point of the matrix.
      fail-fast: false
      matrix:
        include:
          # Real AVD hardware profiles for both handsets, on Android 15
          # (API 35) — the OS they ship with.
          - device: pixel-9
            api-level: 35
            preferred-profile: pixel_9
            fallback-profile: pixel_7
          - device: pixel-9-pro-xl
            api-level: 35
            preferred-profile: pixel_9_pro_xl
            fallback-profile: pixel_7_pro

    steps:
      - uses: actions/checkout@v5

      - name: Download JNI lib (x86_64)
        # The emulator lanes run x86_64 images, so only that ABI is needed in
        # the tree for the Gradle connected build.
        uses: actions/download-artifact@v4
        with:
          name: apk-jniLibs-x86_64
          path: android/app/src/main/jniLibs/

      - name: Verify JNI lib layout
        run: |
          test -f android/app/src/main/jniLibs/x86_64/libcomrade_jni.so \
            || { echo "::error::missing jniLibs/x86_64/libcomrade_jni.so"; exit 1; }

      - name: Install Rust stable
        # See the same step in the build-apk job above: Gradle's Kotlin
        # compile tasks now depend on generateUniffiBindings.
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo (host, uniffi bindgen)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-host-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-host-

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          # Google removed the legacy `tools` SDK package; the action's default
          # `packages` ("tools platform-tools") therefore fails at sdkmanager.
          # Keep platform-tools, drop tools. The next step installs the rest.
          packages: 'platform-tools'

      # ── The two-peer relay ──────────────────────────────────────────────────
      # `TwoPeerJniIntegrationTest` runs two independent `Comrade` FFI instances
      # against one relay and is the only lane in this repo where two peers talk
      # over a real socket through the real generated bindings. It has existed
      # since COMMS-03 and **skipped on every run**, because nothing passed it a
      # relay address and a skipped test is a green test. That is why the field
      # bugs in the together feature were found on handsets rather than here.
      #
      # `10.0.2.2` is the standard emulator-to-host loopback, so a relay on the
      # runner's own localhost is what the emulator reaches. Pinned image, see
      # the compose file for why.
      - name: Start isolated test relay
        run: |
          set -euo pipefail
          docker compose -f deploy/test-relay/docker-compose.yml up -d
          # `up -d` returns once the container is created, not once the relay is
          # accepting connections — so wait for the socket, and fail loudly with
          # the relay's own logs rather than letting the test time out 15 s at a
          # time with nothing to read.
          for i in $(seq 1 60); do
            if (echo > /dev/tcp/127.0.0.1/8090) 2>/dev/null; then
              echo "test relay accepting connections after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::test relay never came up on 127.0.0.1:8090"
          docker compose -f deploy/test-relay/docker-compose.yml logs --no-color
          exit 1

      - name: Enable KVM group perms
        # Hardware acceleration for the emulator on GitHub-hosted Linux runners.
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Create AVD (${{ matrix.device }})
        # The emulator-runner action bundles an older cmdline-tools whose
        # devices.xml predates the Pixel 9 line, so letting it create the AVD
        # fails with "No device found matching --device pixel_9". Create the
        # AVD here with setup-android's current avdmanager instead; the action
        # below reuses it (avd-name + force-avd-creation: false). The fallback
        # profile covers runners whose SDK tools are older still.
        run: |
          set -euo pipefail
          sdkmanager --install \
            "system-images;android-${{ matrix.api-level }};google_apis;x86_64" \
            "platform-tools" "emulator" > /dev/null
          profile="${{ matrix.preferred-profile }}"
          # No pipeline, deliberately: `grep -q` exits on first match and closes
          # the pipe, `avdmanager` takes SIGPIPE, and under `set -o pipefail` the
          # pipeline returns 141 — which `!` inverts into "profile missing", so the
          # job silently builds the *fallback* profile while still passing.
          if ! grep -qx -- "$profile" <<<"$(avdmanager list device -c)"; then
            echo "::warning::AVD profile '$profile' not available in this SDK; using '${{ matrix.fallback-profile }}'"
            profile="${{ matrix.fallback-profile }}"
          fi
          echo "Creating AVD 'test' with profile '$profile'"
          echo "no" | avdmanager create avd --force --name test \
            --package "system-images;android-${{ matrix.api-level }};google_apis;x86_64" \
            --device "$profile"
          avdmanager list avd

      - name: Run on-device smoke tests
        uses: reactivecircus/android-emulator-runner@v2
        env:
          # Baked-in default TURN relay for the assembled test APK (empty if
          # unset). Secrets or repo variables — see the assemble job above.
          TURN_URL: ${{ secrets.TURN_URL || vars.TURN_URL }}
          TURN_USERNAME: ${{ secrets.TURN_USERNAME || vars.TURN_USERNAME }}
          TURN_PASSWORD: ${{ secrets.TURN_PASSWORD || vars.TURN_PASSWORD }}
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          avd-name: test
          force-avd-creation: false
          disable-animations: true
          emulator-options: >-
            -no-snapshot -no-window -gpu swiftshader_indirect -noaudio
            -no-boot-anim -camera-back none
          working-directory: android
          # `adb reverse` rather than the emulator's `10.0.2.2` host loopback:
          # the device's own `127.0.0.1:8090` is carried over the adb channel to
          # the runner's 8090. No dependence on the emulated radio NAT, and it
          # works on a physical handset — which `10.0.2.2` never can — so a
          # future device-farm lane inherits it.
          #
          # **It is not, however, the fix for anything.** An earlier version of
          # this comment said `10.0.2.2` was "what the first run of this lane
          # failed on". That was a guess: the next run used the reverse forward
          # and failed identically, all three tests "nothing arrived". The real
          # cause was `Comrade.newWithRelays` handing both test peers the same
          # process-global runtime, so they shared one npub and alice was DMing
          # herself — see `docs/TOGETHER.md` §19.1. Two network hypotheses were
          # proposed here and neither was real; the reverse forward is kept on
          # its own merits, not as a repair.
          #
          # **Only the URL is passed, and that is the fix rather than an
          # omission.** There was a second `comradeRequireRelay=true` argument
          # here, meant to make a missing URL a failure instead of a skip. It
          # could not work: both arguments travel by the same mechanism, so
          # anything that stops instrumentation arguments arriving drops the
          # demand along with the thing it was demanding, and every test skips
          # green again. It caught only a human deleting one line and leaving the
          # other. `relayUrlOrSkip` in the test now inverts the polarity —
          # skipping is what must be asked for — so CI passing nothing *is* the
          # strict case. The "Assert the two-peer tests actually ran" step below
          # is the backstop, because an in-test guard cannot catch instrumentation
          # that never ran at all.
          #
          # Logcat is captured either way and uploaded on failure. The first red
          # run of this lane could not be diagnosed from Gradle's output — three
          # "nothing arrived" assertions and no reason — and guessing at causes at
          # fifteen minutes a round is not a debugging loop worth having.
          # **One shell command, folded — not a shell script.** This cost two
          # round trips to learn, so it is written down rather than left to the
          # next person: `android-emulator-runner` runs the `script:` input
          # **one line at a time**, each through its own `/usr/bin/sh -c`. The
          # log makes it plain — `sh -c status=0` on one line, `sh -c ./gradlew …`
          # on the next. Two consequences, both of which bit:
          #
          #   * a `\` continuation is passed as a literal argument, so Gradle was
          #     asked to run a task called `\`;
          #   * a variable set on one line does not exist on the next, since that
          #     is a different shell — and `set -uo pipefail` was its own shell
          #     too, which is why dash rejected it there and nowhere else.
          #
          # So this is a YAML *folded* scalar (`>-`): every newline below becomes
          # a space, producing a single `sh -c` with `;` between statements. The
          # explanation has to live up here, because a `#` inside the fold would
          # be part of the command.
          #
          # `|| status=$?` keeps a failing Gradle from skipping the logcat dump,
          # which is echoed to stdout as well as uploaded — the artifact is not
          # always reachable to whoever is reading the failure, and the whole
          # reason for capturing it was that a red run could not be explained from
          # Gradle's output alone.
          script: >-
            adb reverse tcp:8090 tcp:8090 ;
            echo 'reverse forwards now established:' ;
            adb reverse --list ;
            adb reverse --list | grep -q 'tcp:8090 tcp:8090' || { echo '::error::adb reverse tcp:8090 did not register, so the emulator has no route to the relay' ; exit 1 ; } ;
            adb logcat -c || true ;
            status=0 ;
            ./gradlew connectedDebugAndroidTest --no-daemon
            -Pandroid.testInstrumentationRunnerArguments.comradeTestRelayUrl=ws://127.0.0.1:8090
            || status=$? ;
            adb logcat -d > "$RUNNER_TEMP/logcat.txt" 2>&1 || true ;
            if [ "$status" -ne 0 ] ; then
            echo '----- reverse forwards at end of run (empty means it was lost mid-run) -----' ;
            adb reverse --list || true ;
            echo '----- logcat: comrade / relay / socket lines -----' ;
            grep -iE 'comrade|nostr|relay|websocket|refused|ETIMEDOUT|EHOSTUNREACH'
            "$RUNNER_TEMP/logcat.txt" | tail -n 200 || true ;
            echo '----- logcat: last 200 lines -----' ;
            tail -n 200 "$RUNNER_TEMP/logcat.txt" || true ;
            fi ;
            exit $status

      # A skipped test is a green test, and that is how this lane stayed green for
      # months. The instrumentation arguments are *intent*; the results XML is
      # evidence. Assert on the evidence — this also catches "the instrumentation
      # never ran at all", which no in-test guard can.
      - name: Assert the two-peer tests actually ran
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, sys, xml.etree.ElementTree as ET
          root = "android/app/build/outputs/androidTest-results"
          files = glob.glob(root + "/**/*.xml", recursive=True)
          if not files:
              sys.exit("::error::no instrumentation result XML under " + root)
          ran, skipped = [], []
          for f in files:
              for tc in ET.parse(f).iter("testcase"):
                  if tc.get("classname", "").endswith("TwoPeerJniIntegrationTest"):
                      name = tc.get("name")
                      (skipped if tc.find("skipped") is not None else ran).append(name)
          print("two-peer ran:    ", sorted(ran))
          print("two-peer skipped:", sorted(skipped))
          if skipped:
              sys.exit("::error::two-peer test(s) skipped: " + ", ".join(sorted(skipped))
                       + " -- the relay instrumentation arguments never reached the runner, "
                         "so this lane would be green having proven nothing")
          if len(ran) != 3:
              sys.exit("::error::expected 3 two-peer tests, saw %d: %s" % (len(ran), sorted(ran)))
          print("all 3 two-peer tests executed against the relay")
          PY

      # The relay's own view of the session, which is the difference between "the
      # test timed out" and "the peers never reached the relay at all".
      - name: Test relay logs
        if: failure()
        run: docker compose -f deploy/test-relay/docker-compose.yml logs --no-color --tail=200

      - name: Upload instrumentation reports
        # Only worth the storage when something failed.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: device-test-report-${{ matrix.device }}
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
            ${{ runner.temp }}/logcat.txt
          if-no-files-found: ignore
