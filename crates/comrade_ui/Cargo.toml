[package]
name    = "comrade_ui"
version = "0.1.0"
edition = "2021"
publish = false

# Framework-agnostic view-model / service layer shared by every frontend
# (Tauri desktop, Slint/Iced native, Android via JNI). Holds no rendering code.

[dependencies]
comrade_core    = { path = "../comrade_core" }
comrade_state   = { path = "../comrade_state" }
comrade_storage = { path = "../comrade_storage" }
serde      = { workspace = true }
serde_json = { workspace = true }
thiserror  = { workspace = true }
tracing    = { workspace = true }
# The async runtime + Nostr types are needed by the `runtime` module (the IPC
# bridge orchestrator). They were already transitively present via comrade_core;
# declaring them here lets the bridge own its engines and event bus directly.
tokio      = { workspace = true }
nostr-sdk  = { workspace = true }
base64     = { workspace = true }
# Record/Enum/Error derives on this crate's DTOs, `BridgeEvent`, and `UiError`
# — the shared FFI contract every frontend (Tauri, uniffi/Android) is built
# from. Deriving here (not duplicating types in comrade_jni) keeps one
# source of truth as the data model grows.
uniffi     = { workspace = true }

[features]
default = []
# Enable the real HTTP media pipeline (Blossom upload + fetch-and-decrypt) in
# the underlying core. Frontends that ship media (e.g. the Tauri desktop) turn
# this on; the workspace test build leaves it off and exercises the offline path.
media-http = ["comrade_core/media-http"]
# Enable the real catalogue lookup (MusicBrainz over HTTPS) in the underlying
# core. Same argument as `media-http`: the pure parts — query shaping, the tier
# ladder, the licence gate — are always compiled and always tested, and only the
# socket is behind the flag. A frontend that ships search turns this on.
catalogue-http = ["comrade_core/catalogue-http"]
# Enable the real Travel guide lookups (Overpass, Google Places, Wikipedia) in
# the underlying core. Same argument again: the ranking, the merge, the privacy
# blur and every response parser are always compiled and always tested, and only
# the socket is behind the flag. A frontend that ships the Travel tab turns this
# on — `comrade_jni` does, because Android is where the tab lives.
travel-http = ["comrade_core/travel-http"]
# Enable the real link-unfurl fetch (`compose_link_preview`'s call to
# `fetch_preview`) in the underlying core. Same shape as the three flags
# above, with a sharper reason to default it off: the *sender's* side of
# `unfurl.rs` always needs this on to build a card at all, but a frontend
# must never turn it on for the receive path without its own explicit,
# off-by-default "load previews for links I receive" setting — see
# `comrade_core::unfurl`'s module doc.
unfurl-http = ["comrade_core/unfurl-http"]

[dev-dependencies]
tempfile = { workspace = true }
# In-process test relay (tests/support) for the two-peer integration suite.
tokio-tungstenite = { workspace = true }
futures-util      = { workspace = true }
