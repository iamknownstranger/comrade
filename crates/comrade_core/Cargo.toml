[package]
name    = "comrade_core"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
comrade_state = { path = "../comrade_state" }

tokio         = { workspace = true }
nostr-sdk     = { workspace = true }
# The *base* nostr crate that `nostr-sdk` re-exports — same version, so the key
# types are identical and nothing is duplicated. Declared directly because
# `link.rs` must not reach for `nostr-sdk`: the sdk pulls tokio's net stack,
# which does not compile for `wasm32-unknown-unknown` (`mio` fails outright),
# and `link.rs` exists precisely so a browser can one day run it. Keeping the
# import narrow is what makes that a dependency change of zero lines instead of
# a rewrite. See docs/FLUTTER_WEB_MIGRATION.md §4.
nostr         = { workspace = true }
libp2p        = { workspace = true }
yrs           = { workspace = true }
serde         = { workspace = true }
serde_json    = { workspace = true }
regex         = { workspace = true }
thiserror     = { workspace = true }
tracing       = { workspace = true }
aes-gcm       = { workspace = true }
rand          = { workspace = true }
sha2          = { workspace = true }
hkdf          = { workspace = true }
base64        = { workspace = true }
secp256k1     = { workspace = true }
hex           = { workspace = true }
hmac          = { workspace = true }
sha1          = { workspace = true }
url           = { workspace = true }
# Wipes the anonymity device seed (`anon::DeviceSeed`) from memory on drop —
# a leaked seed would deanonymise every persona ever derived from it.
zeroize       = { workspace = true }
# Record/Enum derives on the plain-data types the Vault/Sabha/Identity
# engines expose (e.g. `UpiPaymentIntent`, `CallSignal`) so comrade_jni's
# uniffi scaffolding can lower/lift them with no hand-written FFI mirror.
uniffi        = { workspace = true }

# Optional: real HTTP uploader for NIP-96 file storage. Off by default so the
# core stays lean and CI does not build a TLS/HTTP stack; enable with
# `--features nip96-http`.
reqwest       = { version = "0.12", default-features = false, features = ["rustls-tls", "multipart", "json"], optional = true }

[features]
default = []
# Real HTTP media pipeline: Blossom upload + fetch-and-decrypt + NIP-96 uploader.
media-http = ["dep:reqwest"]
# Back-compat alias; the NIP-96 uploader lives under the same reqwest stack.
nip96-http = ["media-http"]
# Catalogue lookups (MusicBrainz by default) for `/play <free text>`. Off by
# default for the same reason `media-http` is: a plain `cargo test` should not
# build a TLS stack, and nothing in the default build reaches a third party.
catalogue-http = ["dep:reqwest"]
# Travel guide lookups (Overpass/OpenStreetMap, Google Places, Wikipedia). Off by
# default for the same reason the two above are — and with one difference worth
# noting: `travel.rs`'s request builders *and* its response parsers are compiled
# unconditionally, so `cargo test --workspace` covers every fixture. Only the
# socket is behind this flag.
travel-http = ["dep:reqwest"]
# Receiver-side link-unfurling (fetch the page behind a URL to build a preview
# card). Off by default, and for a sharper reason than the three flags above:
# every one of those calls out to a host *this device* chose (a catalogue
# provider, a places API); this one calls out to a host *someone else* chose,
# so turning it on tells that host "this npub opened this link" — exactly the
# metadata this app exists to not leak. `unfurl.rs`'s sender-side preview
# (built and attached before the message is sent) is the default path and
# needs no feature at all. A frontend may only reach this from an explicit,
# off-by-default "load previews for links I receive" setting.
unfurl-http = ["dep:reqwest"]
